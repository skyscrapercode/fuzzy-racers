<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race - Fuzzy Racers</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/race.css">
</head>
<body>
    <!-- 3D world drawn by Three.js -->
    <canvas id="worldCanvas3D"></canvas>
    <!-- HUD (lap, position, minimap, speedo, health, powerup slot, phase
         overlays) painted by Canvas 2D on top of the 3D world. -->
    <canvas id="hudCanvas"></canvas>

    <aside id="fuzzyInspector" hidden></aside>

    <!-- Pause menu (themed overlay; opened by Esc or P) -->
    <div id="pauseMenu" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="pause-panel">
            <h2 class="pause-title" id="pause-title">Paused</h2>
            <p class="pause-sub">Race in progress</p>
            <div class="pause-actions">
                <button class="btn" type="button" id="pauseResume">
                    <span class="btn-icon">▶</span><span>Resume Race</span>
                </button>
                <button class="btn" type="button" id="pauseRestart">
                    <span class="btn-icon">🔄</span><span>Restart Race</span>
                </button>
            </div>
            <div class="pause-hint">Press <span class="key">Esc</span> or <span class="key">P</span> to resume</div>
        </div>
    </div>

    <script src="js/device-guard.js"></script>
    <script src="js/vendor/three.min.js"></script>
    <script src="js/vendor/postprocessing.js"></script>
    <script src="js/state.js"></script>
    <script src="js/fuzzy.js"></script>
    <script src="js/car.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/world3d.js"></script>
    <script src="js/race.js"></script>
</body>
</html>
