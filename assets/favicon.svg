<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fuzzy Racers">
  <defs>
    <radialGradient id="fr-bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%"  stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <filter id="fr-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Dark rounded tile -->
  <rect width="64" height="64" rx="14" fill="#0b0f1f"/>
  <rect width="64" height="64" rx="14" fill="url(#fr-bg)"/>

  <!-- Neon glow behind the car -->
  <path d="M20 26 C20 18 24 13 32 13 C40 13 44 18 44 26 L44 47 C44 51 41 53 37 53 L27 53 C23 53 20 51 20 47 Z"
        fill="#00eaff" opacity="0.55" filter="url(#fr-glow)"/>

  <!-- Wheels (behind body so only the outer halves show) -->
  <g fill="#0a0c14">
    <rect x="15" y="20" width="6" height="10" rx="2"/>
    <rect x="43" y="20" width="6" height="10" rx="2"/>
    <rect x="15" y="37" width="6" height="10" rx="2"/>
    <rect x="43" y="37" width="6" height="10" rx="2"/>
  </g>

  <!-- Car body (top-down, nose up) -->
  <path d="M20 26 C20 18 24 13 32 13 C40 13 44 18 44 26 L44 47 C44 51 41 53 37 53 L27 53 C23 53 20 51 20 47 Z"
        fill="#00eaff" stroke="#062b33" stroke-width="1"/>

  <!-- Magenta racing stripes -->
  <rect x="29.1" y="14" width="2" height="38" rx="1" fill="#ff2bd6"/>
  <rect x="32.9" y="14" width="2" height="38" rx="1" fill="#ff2bd6"/>

  <!-- Cockpit glass -->
  <rect x="26" y="27" width="12" height="13" rx="3.5" fill="#0a0d18"/>

  <!-- Headlights -->
  <rect x="24" y="15" width="4" height="3" rx="1.2" fill="#fff8b0"/>
  <rect x="36" y="15" width="4" height="3" rx="1.2" fill="#fff8b0"/>
</svg>
